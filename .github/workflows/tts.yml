name: tts

on:
  push:
    paths: ["requests/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tts
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts
      - run: python scripts/gen.py
      - name: Commit audio
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add audio
          git diff --cached --quiet && exit 0
          git commit -m "audio: $(git log -1 --format=%s)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
